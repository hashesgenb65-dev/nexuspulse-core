# Continuous integration for NexusPulse.
#
# Runs on every push to main and on every pull request. The job:
#   1. installs exact dependencies from package-lock.json (`npm ci`),
#   2. type-checks the whole project under the strict tsconfig,
#   3. runs the full Vitest suite with V8 coverage,
#   4. uploads the coverage report as a build artifact.
#
# Node 22 is the only supported runtime. The plugin sandbox depends on the
# `--permission` flag and on `process.getBuiltinModule`, which need Node 22.3+.
# Add other versions to the matrix only after they have been verified.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
